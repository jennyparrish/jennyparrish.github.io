<!DOCTYPE html>
<html>

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tiny Project 7: Recipe Minisite - Home Page</title>

    <!-- link rel="stylesheet" href="styles.css" media="all" -->
    <style>
        /* for responsive menu */

        /* variables */
        :root {
            --nav-height: 3rem;
            --nav-bkgd-color: gray;
            --nav-text-color: white;
            --nav-hover-bkgd-color: lightgray;
            --nav-hover-text-color: black;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: var(--nav-height) 0 0 0;
        }

        nav {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: var(--nav-height);
            background-color: var(--nav-bkgd-color);
        }

        #navBurger {
            position: relaative;
            display: block;
            font-size: 2rem;
            color: var(--nav-text-color);
            padding: 0.1em 0 0 0.3em;
            max-height: 2rem;
        }

        nav ul {
            position: relative;
            background-color: var(--nav-hover-bkgd-color);
            list-style: none;
            margin: 0;
            padding: 0;
        }

        nav > ul {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.5s;
        }

        nav.clicked>ul {
            max-height: 90vh;
        }

        nav>ul>li {
            position: relative;
            background-color: var(--nav-bkgd-color);
            display: block;
            margin: 1rem;
        }

        nav>ul>li>a {
            display: block;
            width: 100%;
            height: 100%;
            padding: 0.5rem;
        }

        nav>ul>li>a::after {
            position: absolute;
            content: "ˇ";
            right: 0.3rem;
            top: 0.2rem;
            color: inherit;
            font-size: 110%;
        }

        nav>ul>li>ul {
            margin: 0 0 0 1rem;
            background-color: inherit;
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.5s;
        }

        nav>ul>li.clicked>ul {
            max-height: 40vh;
        }

        nav>ul>li>ul>li {
            padding: 0.5rem 0 0.5rem 0.5rem;
        }

        nav a {
            text-decoration: none;
            color: var(--nav-text-color);
        }

        nav li:hover {
            background-color: var(--nav-hover-bkgd-color);
        }

        nav li:hover a {
            color: var(--nav-hover-text-color);
        }

        /* ----- Media Query for landscape / desktop layouts ----- */
        @media screen and (orientation: landscape) {

            #navBurger {
                display: none;
            }

            nav > ul {
                overflow: visible;
            }

            nav > ul > li {
                float: left;
            }

            nav > ul > li a {
                padding-right: 0.5rem;
                margin: 0;
            }
        
            nav > ul > li > ul {
                margin: 0 0.5rem 0.5rem 0;
                visibility: hidden;
                position: absolute;
            }

            nav > ul > li.clicked > ul {
                display: block;
                visibility: visible;
            }
            
            nav > ul > li > ul li {
                margin: 0;
            }
    
            nav>ul>li>a::after {
                content: "";
            }
        }

    </style>

    <!-- external and internal JavaScript -->
    <script src="scripts.js" defer></script>
    <script>
        // in-page JavaScript here
    </script>

</head>

<body>
    <nav>
        <a id="navBurger">&#9776;</a>

        <ul>
            <li><a href="#">Menu Item One</a>
                <ul>
                    <li><a href="#">Submenu One A</a></li>
                    <li><a href="#">Submenu One B</a></li>
                    <li><a href="#">Submenu One C</a></li>
                </ul>
            </li>

            <li><a href="#">Menu Item Two</a>
                <ul>
                    <li><a href="#">Submenu Two A</a></li>
                    <li><a href="#">Submenu Two B</a></li>
                    <li><a href="#">Submenu Two C</a></li>
                    <li><a href="#">Submenu Two D</a></li>
                    <li><a href="#">Submenu Two E</a></li>
                </ul>
            </li>
        </ul>

    </nav>
    <main>
        <h1>Some title here.</h1>
        <p>More content here.</p>

    </main>
</body>

</html>
